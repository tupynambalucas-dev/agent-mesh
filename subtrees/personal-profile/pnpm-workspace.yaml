catalogMode: 'strict'
shellEmulator: true

peerDependencyRules:
  ignoreMissing:
    - eslint-plugin-import
  allowAny:
    - eslint

minimumReleaseAgeExclude:
  - turbo
  - '@turbo/darwin-64'
  - '@turbo/darwin-arm64'
  - '@turbo/linux-64'
  - '@turbo/linux-arm64'
  - '@turbo/windows-64'
  - '@turbo/windows-arm64'
  - miniflare@4.20260706.0
  - wrangler@4.108.0

packages:
  - 'renderer'
  - 'assets'

catalog:
  '@types/node': ^26.6.2
  'typescript': ^6.0.3
  'tsx': ^4.23.15
  'rimraf': '^6.1.3'
  'turbo': 2.11.5
  'kill-port': '^2.0.1'
  'husky': '^9.1.7'
  'lint-staged': ^17.5.1
  'glob': ^13.0.6
  '@types/glob': ^9.0.0
  '@aws-sdk/client-s3': ^3.1140.0
  '@smithy/node-http-handler': ^4.12.1
  'mime-types': ^3.0.2
  '@types/mime-types': ^3.0.1
  '@clack/prompts': ^1.8.1
  'commander': ^15.0.0
  '@changesets/cli': ^3.0.3
  'wrangler': ^4.140.0
  'jimp': ^1.6.1
  dotenv-cli: ^11.0.0
  gray-matter: ^4.0.3
  vitest: ^5.0.2
  '@types/unist': ^3.0.3
  unified: ^11.0.5
  dotenv: ^18.0.4

catalogs:
  tooling-stack:
    '@docusaurus/eslint-plugin': '3.10.2'
    '@eslint/js': '10.0.1'
    '@typescript-eslint/eslint-plugin': 8.70.1
    'eslint': 10.11.0
    'eslint-import-resolver-typescript': '4.4.5'
    'eslint-plugin-import-x': '^4.17.1'
    'eslint-plugin-mdx': '3.8.1'
    'eslint-plugin-prettier': '^5.5.6'
    'eslint-config-prettier': '^10.1.8'
    'jiti': ^2.7.0
    'prettier': 3.9.9
    'typescript-eslint': 8.70.1

  shared-stack:
    'zod': ^4.6.5
    'dotenv': ^18.0.4
    'date-fns': ^4.4.0
    'axios': ^1.20.0
    '@react-three/fiber': '9.6.1'
    '@react-three/drei': '10.7.7'
    'three': '0.184.0'
    '@types/three': '0.184.0'
    'three-stdlib': '2.36.1'
    'tailwindcss': ^4.3.3

  web-stack:
    'clsx': '^2.1.1'
    '@gsap/react': '^2.1.2'
    'gsap': ^3.15.0
    'react': ^19.3.0
    'react-dom': ^19.3.0
    'react-i18next': ^17.0.15
    'i18next': ^26.4.2
    'react-datepicker': '^9.1.0'
    'zustand': ^5.0.15
    'react-force-graph-2d': ^1.29.1
    '@marsidev/react-turnstile': ^1.6.1
    '@vitejs/plugin-react-swc': ^4.3.3
    '@vitejs/plugin-react': '^4.3.4'
    'lucide-react': ^1.48.0
    '@tailwindcss/vite': ^4.3.3
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    'vite': ^8.3.1
    '@eslint-react/eslint-plugin': ^5.20.8
    'eslint-plugin-react-refresh': ^0.5.7
    'vite-plugin-svgr': ^5.2.0
    '@tailwindcss/postcss': ^4.3.3

  studio-stack:
    '@fontsource-variable/nunito': '^5.2.7'
    'react-icons': ^5.7.0

allowBuilds:
  '@sentry-internal/node-cpu-profiler': true
  '@sentry/node-cpu-profiler': true
  '@swc/core': true
  'bcrypt': true
  'core-js': true
  'esbuild': true
  'msgpackr-extract': true
  'protobufjs': true
  'sharp': true
  'unrs-resolver': true
  'workerd': true
