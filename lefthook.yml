# lefthook.yml - tupynambalucas-dev/agent-mesh
# Authoritative Git Hook Configuration (Evil Martians Lefthook)

pre-commit:
  parallel: true
  commands:
    typecheck:
      run: pnpm -r --filter=... exec tsc --noEmit

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}

pre-push:
  commands:
    prevent-main-push:
      run: |
        BRANCH=$(git branch --show-current)
        if [ "$BRANCH" = "main" ]; then
          echo "[ERROR] Direct push to main branch is strictly blocked."
          exit 1
        fi
