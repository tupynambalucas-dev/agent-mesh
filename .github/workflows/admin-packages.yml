name: Administer & Purge GitHub Packages

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Administrative action to execute"
        required: true
        type: choice
        default: "list"
        options:
          - "list"
          - "delete-one"
          - "purge-obsolete"
          - "purge-all"
      package_name:
        description: "Target package name (required for delete-one, e.g. @tupynambalucas-dev/mcp-playwright)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Run in dry-run mode (set false to execute permanent deletion)"
        required: true
        type: boolean
        default: true
      admin_token:
        description: "Personal Access Token with delete:packages and read:packages scopes (optional, defaults to secrets.ADMIN_PACKAGES_TOKEN)"
        required: false
        type: string
        default: ""

concurrency:
  group: admin-packages
  cancel-in-progress: false

permissions:
  packages: write
  contents: read

jobs:
  admin-packages:
    name: Execute Package Administration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node.js & pnpm
        uses: ./.github/actions/setup-pnpm-env

      - name: Generate GitHub App Token
        id: app-token
        env:
          APP_ID: ${{ secrets.GITHUB_ORG_MANAGER_APP_ID || secrets.ORGANIZATION_APP_ID || secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.GITHUB_ORG_MANAGER_APP_PRIVATE_KEY || secrets.ORGANIZATION_APP_PRIVATE_KEY || secrets.APP_PRIVATE_KEY }}
        if: ${{ env.APP_ID != '' && env.APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Execute Package Administration Script
        env:
          ADMIN_TOKEN: ${{ inputs.admin_token || steps.app-token.outputs.token || secrets.ADMIN_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          ADMIN_ACTION: ${{ inputs.action }}
          TARGET_PACKAGE: ${{ inputs.package_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node .github/scripts/manage-packages.js
