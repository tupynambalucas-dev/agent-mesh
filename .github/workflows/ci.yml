name: Continuous Integration & Verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Types, Builds & Plugin Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node.js & pnpm
        uses: ./.github/actions/setup-pnpm-env

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck Workspace
        run: pnpm typecheck

      - name: Build MCP Packages
        run: pnpm mcp:build

      - name: Validate Antigravity Domain Plugins
        run: |
          curl -fsSL https://antigravity.google/install.sh | bash || true
          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');
            const plugins = fs.readdirSync('plugins/packages');
            let hasAgy = false;
            try { execSync('agy --version', { stdio: 'ignore' }); hasAgy = true; } catch {}
            for (const p of plugins) {
              const full = path.join('plugins', 'packages', p);
              if (!fs.statSync(full).isDirectory()) continue;
              console.log('Validating domain plugin:', p);
              if (hasAgy) {
                execSync('agy plugin validate . --strict', { cwd: full, stdio: 'inherit' });
              } else {
                const manifest = JSON.parse(fs.readFileSync(path.join(full, 'plugin.json'), 'utf8'));
                console.log('Manifest OK:', manifest.name, 'v' + manifest.version);
              }
            }
          "
