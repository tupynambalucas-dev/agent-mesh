name: Continuous Integration & Verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Types, Builds & Plugin Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tupynambalucas-dev'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.1.0
        with:
          version: 10.33.2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck Workspace
        run: pnpm typecheck

      - name: Build MCP Packages
        run: pnpm mcp:build

      - name: Validate Antigravity Domain Plugins
        run: |
          curl -fsSL https://antigravity.google/install.sh | bash || true
          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');
            const plugins = fs.readdirSync('plugins/packages');
            let hasAgy = false;
            try { execSync('agy --version', { stdio: 'ignore' }); hasAgy = true; } catch {}
            for (const p of plugins) {
              const full = path.join('plugins', 'packages', p);
              if (!fs.statSync(full).isDirectory()) continue;
              console.log('Validating domain plugin:', p);
              if (hasAgy) {
                execSync('agy plugin validate . --strict', { cwd: full, stdio: 'inherit' });
              } else {
                const manifest = JSON.parse(fs.readFileSync(path.join(full, 'plugin.json'), 'utf8'));
                console.log('Manifest OK:', manifest.name, 'v' + manifest.version);
              }
            }
          "
