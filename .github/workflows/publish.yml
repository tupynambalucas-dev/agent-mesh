name: Publish Packages to GitHub Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate-and-publish:
    name: Validate, Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tupynambalucas-dev'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build MCP Packages
        run: pnpm -r --filter "./mcp/*" run build

      - name: Validate Antigravity Domain Plugins
        run: |
          curl -fsSL https://antigravity.google/install.sh | bash || true
          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');
            const plugins = fs.readdirSync('plugins');
            let hasAgy = false;
            try { execSync('agy --version', { stdio: 'ignore' }); hasAgy = true; } catch {}
            for (const p of plugins) {
              const full = path.join('plugins', p);
              if (!fs.statSync(full).isDirectory()) continue;
              console.log('Validating domain plugin:', p);
              if (hasAgy) {
                execSync('agy plugin validate . --strict', { cwd: full, stdio: 'inherit' });
              } else {
                const manifest = JSON.parse(fs.readFileSync(path.join(full, 'plugin.json'), 'utf8'));
                console.log('Manifest OK:', manifest.name, 'v' + manifest.version);
              }
            }
          "

      - name: Publish Workspace Packages Idempotently
        if: github.event_name != 'pull_request'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-packages.js
