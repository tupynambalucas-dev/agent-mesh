name: Publish Package to GitHub Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate-and-publish:
    name: Validate and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tupynambalucas-dev'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile || true

      - name: Validate Antigravity Plugin Structure
        run: |
          curl -fsSL https://antigravity.google/install.sh | bash || true
          if command -v agy &> /dev/null; then
            agy plugin validate . --strict
          else
            echo "agy CLI not found in environment; running manual structural checks"
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('plugin.json', 'utf8'));
              const m = JSON.parse(fs.readFileSync('mcp_config.json', 'utf8'));
              console.log('Plugin:', p.name, 'v' + p.version);
              console.log('Configured MCP Servers:', Object.keys(m.mcpServers).join(', '));
            "
          fi

      - name: Check Registry and Publish Idempotently
        if: github.event_name != 'pull_request'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          
          echo "Inspecting package: $PACKAGE_NAME at version $LOCAL_VERSION"
          
          # Query GitHub Packages registry for this specific version
          REMOTE_VERSION=$(npm view "${PACKAGE_NAME}@${LOCAL_VERSION}" version --registry=https://npm.pkg.github.com 2>/dev/null || true)
          
          if [ "$REMOTE_VERSION" = "$LOCAL_VERSION" ]; then
            echo "::notice ::Version $LOCAL_VERSION of $PACKAGE_NAME is already published to GitHub Packages. Skipping publication."
            exit 0
          fi
          
          echo "New version detected ($LOCAL_VERSION). Publishing to GitHub Packages..."
          npm publish --registry=https://npm.pkg.github.com --access=public
