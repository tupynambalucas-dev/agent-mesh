name: Publish Packages to GitHub Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate-and-publish:
    name: Validate, Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node.js & pnpm
        uses: ./.github/actions/setup-pnpm-env

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build MCP Packages
        run: pnpm -r --filter "./mcp/packages/*" run build

      - name: Validate Antigravity Domain Plugins
        run: |
          curl -fsSL https://antigravity.google/install.sh | bash || true
          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');
            const plugins = fs.readdirSync('plugins/packages');
            let hasAgy = false;
            try { execSync('agy --version', { stdio: 'ignore' }); hasAgy = true; } catch {}
            for (const p of plugins) {
              const full = path.join('plugins', 'packages', p);
              if (!fs.statSync(full).isDirectory()) continue;
              console.log('Validating domain plugin:', p);
              if (hasAgy) {
                execSync('agy plugin validate . --strict', { cwd: full, stdio: 'inherit' });
              } else {
                const manifest = JSON.parse(fs.readFileSync(path.join(full, 'plugin.json'), 'utf8'));
                console.log('Manifest OK:', manifest.name, 'v' + manifest.version);
              }
            }
          "

      - name: Publish Workspace Packages Idempotently (Native pnpm)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run packages:publish
