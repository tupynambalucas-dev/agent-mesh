name: Publish Packages to GitHub Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate-and-publish:
    name: Validate, Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tupynambalucas-dev'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build MCP Packages
        run: pnpm -r --filter "./mcp/*" run build

      - name: Validate Antigravity Plugin Structure
        run: |
          curl -fsSL https://antigravity.google/install.sh | bash || true
          if command -v agy &> /dev/null; then
            agy plugin validate . --strict || true
          else
            echo "agy CLI not found in environment; running manual structural verification"
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('plugin.json', 'utf8'));
              console.log('Plugin Manifest:', p.name, 'v' + p.version);
            "
          fi

      - name: Publish Workspace Packages Idempotently
        if: github.event_name != 'pull_request'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-packages.js
